<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ title }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

<header class="topbar">

    <div class="container topbar-content">

        <a href="/" class="logo">
            <span class="logo-ball">⚽</span>
            <span>LiveScore</span>
        </a>

        <nav class="nav">

            <a
                href="/"
                class="active"
            >
                Matches
            </a>

            <a href="/api/v1/competitions">
                Competitions
            </a>

            <a href="/api/v1/standings">
                Standings
            </a>

        </nav>

        <button
            class="search-button"
            type="button"
            aria-label="Search"
        >
            🔍
        </button>

    </div>

</header>


<main>

    <section class="hero">

        <div class="container">

            <div class="hero-content">

                <div>

                    <span class="eyebrow">
                        FOOTBALL LIVE
                    </span>

                    <h1>
                        Live scores.
                        <span>Every match.</span>
                    </h1>

                    <p>
                        Follow live football scores,
                        fixtures and results in one place.
                    </p>

                </div>

            </div>

        </div>

    </section>


    <section class="feed-navigation">

        <div class="container">

            <div
                id="date-navigation"
                class="date-navigation"
            >

                <button
                    id="previous-date"
                    class="date-button"
                    type="button"
                    aria-label="Previous day"
                >
                    ‹
                    <span>Previous</span>
                </button>


                <div class="selected-date">

                    <span
                        class="calendar-icon"
                        aria-hidden="true"
                    >
                        📅
                    </span>

                    <strong id="selected-date">
                        TODAY
                    </strong>

                </div>


                <button
                    id="next-date"
                    class="date-button"
                    type="button"
                    aria-label="Next day"
                >
                    <span>Next</span>
                    ›
                </button>

            </div>


            <div class="tabs">

                <button
                    class="tab"
                    data-feed="live"
                    type="button"
                >
                    <span class="live-dot"></span>
                    LIVE
                </button>

                <button
                    class="tab active"
                    data-feed="today"
                    type="button"
                >
                    TODAY
                </button>

                <button
                    class="tab"
                    data-feed="upcoming"
                    type="button"
                >
                    UPCOMING
                </button>

                <button
                    class="tab"
                    data-feed="finished"
                    type="button"
                >
                    FINISHED
                </button>

            </div>

        </div>

    </section>


    <section class="matches-section">

        <div class="container">

            <div class="section-header">

                <div>

                    <span
                        class="section-label"
                        id="section-label"
                    >
                        TODAY
                    </span>

                    <h2 id="section-title">
                        Today's Matches
                    </h2>

                </div>


                <button
                    id="refresh-button"
                    class="refresh-button"
                    type="button"
                >
                    ↻ Refresh
                </button>

            </div>


            <div
                id="matches-container"
                class="matches-container"
            >

                <div class="loading">

                    <div class="spinner"></div>

                    <span>
                        Loading matches...
                    </span>

                </div>

            </div>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="container">

        <p>
            Football LiveScore
            <span>•</span>
            Live football data
        </p>

    </div>

</footer>


<script
    src="{{ url_for('static', path='js/app.js') }}"
></script>

</body>
</html>
