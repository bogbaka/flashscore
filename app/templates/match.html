<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ title }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

    <style>
        .match-page {
            padding: 32px 0 60px;
        }

        .match-header {
            background: #ffffff;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 24px;
            color: #555;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            color: #111;
        }

        .competition-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .competition-header img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .competition-name {
            font-weight: 700;
            color: #333;
        }

        .match-date {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .match-scoreboard {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 24px;
        }

        .details-team {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
        }

        .details-team-logo {
            width: 88px;
            height: 88px;
            object-fit: contain;
        }

        .details-team h2 {
            margin: 0;
            font-size: 20px;
        }

        .team-short-name {
            color: #888;
            font-size: 13px;
        }

        .details-result {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .details-score-value {
            font-size: 42px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .match-status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 5px 10px;
            border-radius: 999px;
            background: #eee;
            color: #555;
            font-size: 12px;
            font-weight: 700;
        }

        .match-status.live {
            background: #e8f8ed;
            color: #14833b;
        }

        .events-section {
            margin-top: 24px;
            background: #ffffff;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .section-heading {
            margin-bottom: 20px;
        }

        .section-heading h2 {
            margin: 0;
        }

        .events-list {
            display: flex;
            flex-direction: column;
        }

        .match-event {
            display: grid;
            grid-template-columns: 55px 42px 1fr;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .match-event:last-child {
            border-bottom: none;
        }

        .event-minute {
            color: #777;
            font-size: 13px;
            font-weight: 700;
            text-align: right;
        }

        .event-icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f4f4f4;
            font-size: 16px;
        }

        .event-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .event-info strong {
            color: #222;
        }

        .event-info span {
            color: #777;
            font-size: 13px;
        }

        .empty-events,
        .match-error,
        .match-loading {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }

        .match-error strong,
        .empty-events strong {
            display: block;
            color: #222;
            margin-bottom: 8px;
        }

        @media (max-width: 650px) {
            .match-header,
            .events-section {
                padding: 20px;
            }

            .match-scoreboard {
                gap: 10px;
            }

            .details-team-logo {
                width: 64px;
                height: 64px;
            }

            .details-team h2 {
                font-size: 15px;
            }

            .details-score-value {
                font-size: 32px;
            }

            .match-event {
                grid-template-columns: 45px 36px 1fr;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="container topbar-content">

        <a href="/" class="logo">
            <span class="logo-ball">⚽</span>
            <span>LiveScore</span>
        </a>

        <nav class="nav">

            <a href="/">
                Matches
            </a>

            <a href="/api/v1/competitions">
                Competitions
            </a>

            <a href="/api/v1/standings">
                Standings
            </a>

        </nav>

        <button
            class="search-button"
            type="button"
            aria-label="Search"
        >
            🔍
        </button>

    </div>

</header>


<main class="container match-page">

    <div id="match-container">

        <div class="match-loading">
            Loading match...
        </div>

    </div>

</main>


<footer class="footer">

    <div class="container">

        <p>
            Football LiveScore
            <span>•</span>
            Live football data
        </p>

    </div>

</footer>


<script
    src="{{ url_for('static', path='js/match.js') }}"
></script>

</body>
</html>
